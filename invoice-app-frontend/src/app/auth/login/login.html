<div class="min-h-screen flex items-center justify-center bg-gray-100">

  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">

    <h1 class="text-3xl font-bold mb-6 text-center">
      Login
    </h1>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      class="space-y-4"
    >

      <div>
        <label class="block mb-1 font-medium">
          Username
        </label>

        <input
          type="text"
          formControlName="username"
          class="w-full border rounded-lg p-3"
          [class.opacity-50]="isLoading"
          [class.border-red-500]="loginForm.controls.username.invalid && loginForm.controls.username.touched"
        />
        @if (loginForm.controls.username.invalid &&
            loginForm.controls.username.touched)
        {
            <p class ="text-red-500 text-sm mt-1">Username is required</p>
        }
      </div>

      <div>
        <label class="block mb-1 font-medium">
          Password
        </label>

        <input
          type="password"
          formControlName="password"
          class="w-full border rounded-lg p-3"
          [class.opacity-50]="isLoading"
          [class.border-red-500]="loginForm.controls.password.invalid && loginForm.controls.password.touched"
        />
        @if (loginForm.controls.password.invalid &&
            loginForm.controls.password.touched)
        {
            <p class ="text-red-500 text-sm mt-1">Password is required</p>
        }
      </div>

      @if (errorMessage) {
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4 text-sm" role="alert">
          <span class="block sm:inline">{{ errorMessage }}</span>
        </div>
      }
      <button type="submit"
        class="w-full bg-black text-white p-3 rounded-lg hover:opacity-90 disabled:bg-gray-400"
        [disabled]="loginForm.invalid || isLoading"
      >
        @if (isLoading) {
            Logging in...
        } 
        @else {
            Login
        }
      </button>

    </form>

  </div>

</div>
