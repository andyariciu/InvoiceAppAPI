name: API and frontend check

on:
  pull_request:
    branches: [ main, master ]

jobs:
  # ==========================================
  # JOB 1: Checking API (.NET)
  # ==========================================
  verify-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./InvoiceApp

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build API
      run: dotnet build --no-restore --configuration Release

    - name: Run API Tests
      run: dotnet test --no-build --verbosity normal

  # ==========================================
  # JOB 2: Checking Frontend (Angular)
  # ==========================================
  verify-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./invoice-app-frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './invoice-app-frontend/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Lint Frontend
      run: npm run lint --if-present

    - name: Build Frontend (Verificare erori de compilare)
      run: npm run build -- --configuration=production